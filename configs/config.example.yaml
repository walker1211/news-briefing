# Shadow sources are fetched only during scheduled windows and written to
# <output.dir>/state/source-shadow. They never enter AI summaries, email,
# XHS manifests, source-health state, or the seen store.
source_shadow:
  enabled: false
  retention: 72h
  timeout: 2m
  sources:
    - name: The Verge (shadow)
      url: https://www.theverge.com/rss/index.xml
      type: rss
      category: AI/科技
      source_role: original
      max_items: 30

x_accounts:
  enabled: false
  accounts_path: <x-visible-data-dir>/accounts.ndjson
  searches_path: <x-visible-data-dir>/searches.ndjson
  history_dir: <x-visible-data-dir>/history
  refresh_status_path: <x-visible-data-dir>/status.json
  lookback: 24h
  refresh_wait_timeout: 10m
  refresh_wait_interval: 5s
  # Active scheduled windows only; no polling occurs when no window is pending/waiting/running.
  refresh_reconcile_interval: 1m
  refresh_heartbeat_stale_after: 3m
  max_posts_per_target: 10
  original_only: true
  category: AI/科技
  accounts:
    - handle: example_ai_company # Replace with the X account handle to track.

