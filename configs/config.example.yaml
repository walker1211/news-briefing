# Exact host/path matches only; URL query parameters are ignored.
# Built-in safety rules still reject known generic previews and tracking pixels.
image_filter:
  blocked_urls:
    - host: file.caixin.com
      path: /images/common/images/shareimg.jpg

fetch:
  timeout: 30s
  retry_times: 3
  retry_wait_time: 200ms
  # Keep the first retry short, then spread later retries to avoid synchronized bursts.
  retry_backoff_factor: 3
  retry_max_wait_time: 2s
  retry_jitter: 200ms
  reddit_source_delay_min: 60s
  reddit_source_delay_max: 70s
  reddit_rate_limit_wait_max: 120s

# A single failed formal window is retained as state but omitted from the
# briefing. The second consecutive failure is shown; a later success is shown
# once as a recovery notice.
source_health:
  alert_after_consecutive_failures: 2

watch:
  article_concurrency: 8
  # When Browsebox transport retries are exhausted, make the final attempt with
  # the normal HTTP client (which may still use proxy.http/proxy.socks5).
  fallback_to_direct_on_last_retry: true
  # Normal runs only fetch changed/new article bodies. A bounded oldest-first
  # audit still detects silent body changes without downloading the full corpus.
  deep_verify_interval: 24h
  deep_verify_batch_size: 48
  sites:
    - name: Anthropic Claude Support
      type: anthropic_support
      home_url: https://support.claude.com/zh-CN
      briefing_category: AI/科技
      category_allowlist:
        - Claude
        - 安全保障
        - 隐私与法律
        - Claude 付费套餐
        - Claude API 与控制台
        - 团队与企业套餐
      high_value_keywords:
        - 身份验证
        - 电话验证
        - 账户限制
        - 地区可用性
        - 计费
        - 套餐
        - 配额
        - API 权限
        - 登录
        - 封禁
        - 申诉
        - 隐私
        - 数据使用
        - 训练
        - 安全策略
        - 风控
        - 团队
        - 企业
    - name: Anthropic News
      type: announcement_page
      home_url: https://www.anthropic.com/news
      briefing_category: AI/科技
      high_value_keywords:
        - Claude
        - Opus
        - Sonnet
        - model
        - API
    - name: Claude Platform Release Notes
      type: announcement_page
      home_url: https://docs.claude.com/en/release-notes/overview
      briefing_category: AI/科技
      high_value_keywords:
        - Claude
        - Opus
        - Sonnet
        - API
        - release
  proxy_provider:
    enabled: false
    type: browsebox
    mode: proxy
    command: browsebox
    group: ""
    # health_urls omitted: defaults to watch.sites[*].home_url
    nodes_concurrency: 12
    delay_timeout_ms: 7000
    startup_timeout: 2m
    proxy_port: 17997
    controller_port: 17998

email:
  smtp_host: smtp.example.com
  smtp_port: 465
  from: from@example.com
  to: to@example.com
  # Optional additional recipients. The primary recipient above is always included.
  # recipients:
  #   - another@example.com
  timeout: 3s
  retry_times: 3
  retry_wait_time: 500ms
  use_proxy: false

schedule:
  - "0 8 * * *"
  - "0 18 * * *"
# Optional. Grace delay before cron fallback runs while keeping the schedule window boundaries above.
# Upstream X visible refresh can trigger the same window earlier with `news-briefing x ready`.
schedule_delay: 10m
# Optional. Maximum wait for an in-progress RSS/Watch prefetch after X becomes ready.
# Defaults to 2m; increase it when ordinary feeds usually take longer than X refresh.
schedule_prefetch_wait_timeout: 2m

# Optional. Defaults to the machine's local timezone when omitted.
# schedule_timezone: Asia/Shanghai

output:
  dir: output
  mode: translated_only
  include_filtered_articles: false
  # Optional. Limits articles sent into briefing AI by category; omitted categories are excluded when set.
  max_articles:
    AI/科技: 90
    新闻财经: 30
    国际政治: 30
  # Optional. If AI summary generation fails or times out, retry once per fallback level.
  fallback:
    enabled: true
    levels:
      - name: reduced
        max_articles:
          AI/科技: 60
          新闻财经: 20
          国际政治: 20
      - name: minimal
        max_articles:
          AI/科技: 30
          新闻财经: 10
          国际政治: 10

publish_hook:
  enabled: false
  # fail marks the whole briefing run failed; warn keeps the generated briefing successful.
  failure_policy: fail
  command: ./content-publisher
  args:
    - publish-all
    - --file
    - "{markdown_file}"
    - --source
    - "{source_app}"
    - --date
    - "{date}"
    - --period
    - "{period}"
    - --xhs-card-manifest
    - "{xhs_card_manifest}"
    - --xhs-declare-original=false
    - --channels
    - wechat,xhs
    - --mode
    - submit
    # Repeat --only-section to combine multiple categories in one article for every channel.
    - --only-section
    - AI/科技
    - --only-section
    - 新闻财经

proxy:
  http: http://127.0.0.1:7897
  socks5: socks5://127.0.0.1:7897

ai:
  command: codex
  args:
    - exec
    - --ignore-user-config
    - --ephemeral
    - --skip-git-repo-check
    - --sandbox
    - read-only
    - --color
    - never
    - --disable
    - apps
    - --disable
    - plugins
    - --disable
    - remote_plugin
  models:
    default: gpt-5.6-terra
    default_effort: medium
    # The category workers above produce factual candidates; the final editor only selects and ranks them.
    summary_editor: gpt-5.6-terra
    summary_editor_effort: high
    translation: gpt-5.3-codex-spark
    translation_effort: high
  summary:
    # Summarize categories concurrently, then run one cross-category final edit.
    parallel_by_category: true
    max_concurrency: 3
    editor:
      enabled: true
      # These are global bounds, not per-category quotas. The editor may vary the category mix each run.
      min_stories: 12
      target_stories: 17
      max_stories: 20
  append_system_prompt: true
  timeout:
    # Warn but keep waiting when one AI attempt is still running after this duration.
    warning_after: 20m
    # Stop one AI attempt after this duration and move to retry or fallback.
    attempt_timeout: 30m
    # Stop the whole AI summary stage after this total duration across retries and fallbacks.
    total_budget: 75m
  retry:
    delays:
      - 1s
      - 2s
      - 5s
      - 9s
      - 17s
